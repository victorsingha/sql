<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SQL Utility Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* Custom variables for sidebar and content */
    :root {
      --sidebar-hover-bg: rgba(0, 0, 0, 0.04);
      --sidebar-active-bg: rgba(0, 0, 0, 0.06);
      --sidebar-text: #4b5563;
    }

    html[style*="dark"] {
      --sidebar-hover-bg: rgba(255, 255, 255, 0.05);
      --sidebar-active-bg: rgba(255, 255, 255, 0.08);
      --sidebar-text: #9ca3af;
    }

    html[style*="light"] {
      --sidebar-hover-bg: rgba(0, 0, 0, 0.04);
      --sidebar-active-bg: rgba(0, 0, 0, 0.06);
      --sidebar-text: #4b5563;
    }

    /* Base typography with full emoji support fallback chain */
    body {
      font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      line-height: 1.65;
      background-color: var(--background) !important;
      color: var(--textColor) !important;
      border: none !important;
    }

    /* No underlines or borders anywhere on links */
    a, 
    a:hover, 
    .markdown-section a, 
    .markdown-section a:hover, 
    .sidebar-nav a, 
    .sidebar-nav a:hover {
      text-decoration: none !important;
      border-bottom: none !important;
      border: none !important;
    }

    /* Markdown body alignment and reading flow */
    .markdown-section {
      max-width: 820px;
      margin: 0 auto;
      padding: 30px 45px 80px 45px;
    }

    /* Headings styling and alignment with vertical emoji adjustments */
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      font-family: "Manrope", sans-serif;
      font-weight: 600;
      color: var(--textColor) !important;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      border: none !important;
    }

    .markdown-section h1 {
      font-size: 2.1rem;
      margin-bottom: 1.6rem;
    }

    /* Remove dividers and lines from headings and the main section */
    .markdown-section h2 {
      font-size: 1.55rem;
      margin-top: 2.6rem;
      padding-bottom: 0px !important;
      border-bottom: none !important; /* Remove bottom border divider line */
    }

    .markdown-section h3 {
      font-size: 1.2rem;
      margin-top: 1.8rem;
    }

    /* Hide horizontal dividers completely */
    hr, 
    .markdown-section hr {
      display: none !important;
    }

    /* Paragraphs and list items with emoji support styling */
    .markdown-section p,
    .markdown-section li {
      font-weight: 400;
      line-height: 1.7;
      vertical-align: middle;
    }

    /* Code blocks alignment & styling - completely borderless */
    .markdown-section pre,
    .markdown-section code {
      font-weight: 400 !important;
      font-family: "IBM Plex Mono", monospace;
      border: none !important;
    }

    .markdown-section pre {
      font-size: 14px;
      line-height: 1.6;
      border-radius: 6px;
      padding: 1.1rem 1.3rem;
      background-color: var(--codeBackgroundColor) !important;
      border: none !important;
      margin: 1.5em 0;
    }

    /* Inline code spacing and styling - completely borderless */
    .markdown-section p code,
    .markdown-section li code,
    .markdown-section td code {
      font-weight: 500 !important;
      background-color: var(--codeBackgroundColor) !important;
      color: var(--textColor) !important;
      padding: 0.2rem 0.4rem !important;
      border-radius: 4px;
      border: none !important;
      font-size: 0.9em;
    }

    /* Prevent bold inside highlighted tokens */
    .token,
    .hljs {
      font-weight: 400 !important;
    }

    /* Clean Borderless Sidebar Design (Next.js/Tailwind style) */
    .sidebar {
      background-color: var(--background) !important;
      border-right: none !important; /* Remove separator line on right of sidebar */
      border: none !important;
      width: 270px !important;
      transition: all 0.2s ease !important;
      padding-top: 30px !important;
    }

    .sidebar > h1 {
      font-size: 15px !important;
      font-weight: 700 !important;
      padding: 0 20px !important;
      margin: 24px 0 !important;
      color: var(--textColor) !important;
      opacity: 0.9;
      border: none !important;
    }

    .sidebar > h1 a {
      color: inherit !important;
      border: none !important;
    }

    .sidebar-nav {
      padding-left: 12px !important;
      padding-right: 12px !important;
      border: none !important;
    }

    .sidebar-nav li {
      margin: 0 !important;
      border: none !important;
    }

    .sidebar-nav a {
      color: var(--sidebar-text) !important;
      font-weight: 500 !important;
      font-size: 13.5px !important;
      padding: 7px 12px 7px 12px !important;
      margin: 2px 0 !important;
      border-radius: 6px !important;
      transition: all 0.15s ease !important;
      display: block;
      opacity: 0.85;
      border: none !important;
    }

    .sidebar-nav a:hover {
      background-color: var(--sidebar-hover-bg) !important;
      color: var(--textColor) !important;
      opacity: 1 !important;
      border: none !important;
    }

    /* Completely borderless active sidebar item override */
    .sidebar-nav li.active > a {
      background-color: var(--sidebar-active-bg) !important;
      color: var(--accent) !important;
      font-weight: 600 !important;
      opacity: 1 !important;
      border: none !important;
      border-right: none !important;
      border-left: none !important;
    }

    /* Link layout alignment */
    .content {
      left: 270px !important;
      border: none !important;
    }

    /* Search input layout alignment - completely borderless */
    .search {
      padding: 0 12px 16px 12px !important;
      border: none !important;
    }

    .search input {
      border: none !important;
      background-color: var(--sidebar-hover-bg) !important;
      color: var(--textColor);
      border-radius: 6px !important;
      font-size: 13.5px;
      padding: 8px 12px 8px 12px !important;
      transition: all 0.2s ease;
      width: 100% !important;
      box-sizing: border-box !important;
    }

    .search input:focus {
      border: none !important;
      outline: none;
      box-shadow: 0 0 0 2px var(--sidebar-active-bg);
    }

    /* Remove borders from tables */
    .markdown-section table,
    .markdown-section th,
    .markdown-section td {
      border: none !important;
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--borderColor);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }
  </style>
</head>

<body>

  <div id="app"></div>

  <script>
    window.$docsify = {
      name: 'SQL SERVER UTILITY',
      repo: 'https://github.com/victorsingha/sql',
      homepage: 'README.md',

      // ✅ Search Configuration
      search: {
        maxAge: 86400000,      // cache search index for 1 day
        paths: 'auto',         // index all markdown files
        placeholder: 'Search...',
        noData: 'No results found!',
        depth: 3
      },

      // Dark/Light Theme
      darklightTheme: {
        siteFont: "Manrope",
        defaultTheme: 'light',
        codeFontFamily: 'IBM Plex Mono, monospace',
        bodyFontSize: '15px',
        dark: {
          background: '#121214',
          textColor: '#e4e4e7',
          codeBackgroundColor: '#1a1a1c',
          codeTextColor: '#cbd5e1',
          borderColor: '#27272a',
          accent: '#ffffff',
          coverBackground: '#121214',
          toTopBackground: '#1a1a1c',
          toTopColor: '#ffffff'
        },
        light: {
          background: '#f4f4f5',
          textColor: '#18181b',
          codeBackgroundColor: '#ffffff',
          codeTextColor: '#18181b',
          borderColor: '#e4e4e7',
          accent: '#18181b',
          coverBackground: '#f4f4f5',
          toTopBackground: '#ffffff',
          toTopColor: '#000000'
        }
      }
    }
  </script>

  <!-- Docsify Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Search Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

  <!-- Dark/Light Toggle -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>

</body>
</html>
